name: Measure compiled 527 VST3
on:
  push:
    paths: ['.github/workflows/measure.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  measure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 527-0.1-Windows-x64-VST3
          run-id: 44264615764
          github-token: ${{ github.token }}
          path: binary
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pedalboard numpy
      - shell: bash
        run: |
          python - <<'PY'
          import numpy as np, csv, pathlib, json
          from pedalboard import load_plugin
          paths=list(pathlib.Path('binary').rglob('*.vst3'))
          print('BUNDLE FILES', [str(x) for x in pathlib.Path('binary').rglob('*')], flush=True)
          candidates=[p for p in paths if p.is_file()]+[p for p in paths if p.is_dir()]
          for path in candidates:
              try:
                  p=load_plugin(str(path.resolve()))
                  break
              except ImportError as e:
                  print(str(e),flush=True)
          else:
              raise RuntimeError('No loadable VST3 binary')
          print('PARAMETERS',list(p.parameters))
          sr=44100
          n=sr*2
          t=np.arange(n)/sr
          def setp(key,val):
              setattr(p,key,val)
          def measure(f,dbu,out,ratio,threshold=0):
              for k,v in [('output',out),('ratio',ratio),('threshold',threshold),('attack',10),('release',0.5)]:
                  setp(k,v)
              x=(10**((dbu-22)/20)*np.sin(2*np.pi*f*t)).astype(np.float32)
              y=p.process(np.stack([x,x]),sr,buffer_size=512,reset=True)[0,-sr:]
              spec=2*np.abs(np.fft.rfft(y))/sr
              fund=spec[f]
              db=lambda a:float(20*np.log10(max(float(a),1e-15)))
              harmonics=[db(spec[k*f]) if k*f<sr/2 else None for k in range(2,21)]
              dbc=[a-db(fund) if a is not None else None for a in harmonics]
              thd=100*np.sqrt(sum(spec[k*f]**2 for k in range(2,21) if k*f<sr/2))/max(fund,1e-15)
              return dict(hz=f,input_dbu=dbu,output_setting_db=out,ratio=ratio,threshold=threshold,fund_dbfs=db(fund),gain_db=db(fund)-(dbu-22),thd_pct=float(thd),harmonics_dbfs=harmonics,harmonics_dbc=dbc)
          rows=[]
          for ratio in (2,8):
              for f in (100,1000,5000,10000):
                  for level in (-30,-18,0,4,10,18):
                      for out in (-12,-6,0,6,10):
                          print('DRIVE',json.dumps(measure(f,level,out,ratio)),flush=True)
          print('FOCUS',json.dumps(measure(1000,4,0,2)),flush=True)
          for f in (100,1000,5000,10000):
              for dbu in (-30,-18,0,4,10,18):
                  for out in (-12,-6,0,6,10):
                      rows.append(measure(f,dbu,out,2))
          focus=next(r for r in rows if r['hz']==1000 and r['input_dbu']==4 and r['output_setting_db']==0 and r['ratio']==2)
          pathlib.Path('measurements.json').write_text(json.dumps(rows))
          with open('measurements.csv','w',newline='') as fd:
              w=csv.DictWriter(fd,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          print('FOCUS',json.dumps(focus))
          print('COUNT',len(rows))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 527-binary-measurements
          path: measurements.*
