name: Windows x64 VST3
on:
  push:
    branches: [main]
    paths: ['Source/**', 'reference/**', 'CMakeLists.txt', '.github/workflows/windows.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target Comp527_VST3 --parallel 4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pedalboard numpy
      - shell: bash
        run: |
          python - <<'PY'
          import numpy as np, csv, pathlib, json
          from pedalboard import load_plugin
          path=next(x for x in pathlib.Path('build/Comp527_artefacts/Release/VST3').rglob('*.vst3') if x.is_file())
          p=load_plugin(str(path.resolve()))
          sr=44100
          t=np.arange(sr*5)/sr
          results=[]
          for bank,fn in [(2,'525c-thd-reference.csv'),(8,'525c-mod-8-harmonics.csv')]:
              refs={}
              for r in csv.DictReader(open('reference/'+fn)):
                  if r['settled_half_window_0_1db']!='True' or r.get('deess','0')!='0': continue
                  refs[(int(r['hz']),float(r['input_dbu']))]=r
              for (f,l),r in sorted(refs.items()):
                  if f not in (100,1000,5000,10000): continue
                  p.ratio=bank
                  p.threshold=0
                  p.output=0
                  p.attack=10
                  p.release=.5
                  x=(10**((l-22)/20)*np.sin(2*np.pi*f*t)).astype(np.float32)
                  ks=list(range(2,min(20,(sr//2-1)//f)+1))
                  target=100*np.sqrt(sum(10**(float(r[f'k{k}_dbc'])/10) for k in ks))
                  row={'hz':f,'input_dbu':l,'ratio':bank,'reference_thd_pct':float(target)}
                  for enabled in (False,True):
                      p.colour=enabled
                      y=p.process(np.stack([x,x]),sr,buffer_size=512,reset=True)[0,-sr:]
                      a=2*np.abs(np.fft.rfft(y))/sr
                      fund=a[f]
                      h=[float(20*np.log10(max(a[k*f],1e-15))) for k in ks]
                      thd=float(100*np.sqrt(sum(a[k*f]**2 for k in ks))/max(fund,1e-15))
                      if enabled:
                          row.update(thd_pct=thd,error_pct=100*(thd/target-1),fund_dbfs=float(20*np.log10(fund)),harmonics_dbfs=h)
                      else: row['detector_only_thd_pct']=thd
                  results.append(row)
                  print('CALIBRATION',json.dumps(row),flush=True)
          pathlib.Path('calibration.json').write_text(json.dumps(results,indent=2))
          drive=[]
          for ratio in (2,8):
              p.ratio=ratio
              p.threshold=0
              p.attack=10
              p.release=.5
              p.colour=True
              for f in (100,1000,5000,10000):
                  ks=list(range(2,min(20,(sr//2-1)//f)+1))
                  for l,out in [(4,0),(6,0),(8,0),(10,0),(18,0),(4,4),(4,6),(8,10)]:
                      p.output=out
                      x=(10**((l-22)/20)*np.sin(2*np.pi*f*t)).astype(np.float32)
                      y=p.process(np.stack([x,x]),sr,buffer_size=512,reset=True)[0,-sr:]
                      a=2*np.abs(np.fft.rfft(y))/sr
                      e=sum(float(a[k*f])**2 for k in ks if k%2==0)
                      o=sum(float(a[k*f])**2 for k in ks if k%2==1)
                      row=dict(hz=f,ratio=ratio,input_dbu=l,output_db=out,effective_dbu=l+out,thd_pct=100*np.sqrt(e+o)/max(float(a[f]),1e-15),even_energy_pct=100*e/max(e+o,1e-30),fund_dbfs=float(20*np.log10(max(a[f],1e-15))),harmonics_dbc=[float(20*np.log10(max(a[k*f],1e-15)/max(a[f],1e-15))) for k in ks])
                      drive.append(row)
                      print('HIGH_DRIVE',json.dumps(row),flush=True)
          pathlib.Path('high-drive.json').write_text(json.dumps(drive,indent=2))
          trim=[]
          p.ratio=2
          p.threshold=0
          p.output=0
          p.colour=True
          x=(10**((4-22)/20)*np.sin(2*np.pi*1000*t)).astype(np.float32)
          for db in (-15,0,15):
              p.digital_output=db
              y=p.process(np.stack([x,x]),sr,buffer_size=512,reset=True)[0,-sr:]
              a=2*np.abs(np.fft.rfft(y))/sr
              row=dict(trim_db=db,fund_dbfs=float(20*np.log10(a[1000])),thd_pct=float(100*np.sqrt(sum(a[k*1000]**2 for k in range(2,21)))/a[1000]))
              trim.append(row)
              print('DIGITAL_TRIM',json.dumps(row),flush=True)
          p.digital_output=0
          pathlib.Path('digital-trim.json').write_text(json.dumps(trim,indent=2))


          PY
      - name: Capture compiled plugin editor
        timeout-minutes: 2
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install pillow
          python - <<'PY'
          import pathlib, threading, time
          from pedalboard import load_plugin
          from PIL import ImageGrab
          path=next(x for x in pathlib.Path('build/Comp527_artefacts/Release/VST3').rglob('*.vst3') if x.is_file())
          p=load_plugin(str(path.resolve()))
          def capture():
              time.sleep(4)
              ImageGrab.grab(all_screens=True).save('527-editor.png')
          threading.Thread(target=capture,daemon=True).start()
          import os
          def stop():
              time.sleep(12)
              os._exit(0)
          threading.Thread(target=stop,daemon=True).start()
          p.show_editor()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 527-editor-preview
          path: 527-editor.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: 527-calibration
          path: |
            calibration.json
            high-drive.json
            digital-trim.json
      - uses: actions/upload-artifact@v4
        with:
          name: 527-0.1-Windows-x64-VST3
          path: build/Comp527_artefacts/Release/VST3/
          if-no-files-found: error
